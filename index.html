                            {view === 'project' && Object.entries(groupedBySubject).map(([subj, data]) => (
                                <div key={subj} className="mb-6">
                                    <h4 className="text-gold font-bold mb-2 border-b border-white/10">{subj} <span className="text-xs text-gray-400 ml-2">(累計專注: {data.totalTime} 分鐘)</span></h4>
                                    {data.logs.map((h, i) => (
                                        <div key={i} className="text-sm text-gray-300 ml-4 mb-1 flex justify-between">
                                            <span>{h.item}</span>
                                            <span className="text-xs text-gray-500">{h.details}</span>
                                        </div>
                                    ))}
                                </div>
                            ))}
                            {data.adventure_log.length === 0 && <div className="text-gray-500 text-center">暫無紀錄</div>}
                        </div>
                    </div>
                );
            };

            // --- 🏪 Tab 5: 祕法集市 ---
            const ShopView = () => {
                const [activeSubTab, setActiveSubTab] = useState('market'); 
                const [editMode, setEditMode] = useState(false);
                const [newItem, setNewItem] = useState({ name: "", cost: 100, currency: "mithril", desc: "" });

                const buy = (item) => {
                    const key = `coins_${item.currency}`;
                    const currentBalance = Number(data.profile[key]);
                    const itemCost = Number(item.cost);

                    if(currentBalance >= itemCost) {
                        if(confirm(`購買 ${item.name}?`)) {
                            const newInv = { ...data.inventory };
                            newInv[item.id] = (newInv[item.id] || 0) + 1;
                            setData(prev => ({
                                ...prev,
                                profile: { ...prev.profile, [key]: currentBalance - itemCost },
                                inventory: newInv,
                                history: [{ date: new Date().toLocaleString(), item: `購買: ${item.name}`, cost: `-${itemCost} ${item.currency}`, type: 'expense' }, ...prev.history]
                            }));
                            showToast("交易成功", "gift");
                        }
                    } else showToast("餘額不足", "ban");
                };

                const updateShopItem = (id, field, val) => {
                    setData(p => ({...p, shop: p.shop.map(i => i.id === id ? { ...i, [field]: val } : i)}));
                };

                const addItem = () => {
                    setData(p => ({...p, shop: [...p.shop, {id: Date.now(), ...newItem}]}));
                    setNewItem({ name: "", cost: 100, currency: "mithril", desc: "" });
                    soundEngine.playSFX('success');
                };

                const useItem = (itemId) => {
                    const item = data.shop.find(i => i.id == itemId);
                    if(!item) return;
                    if(item.effect === 'rest_day') {
                        setData(p => ({ ...p, profile: { ...p.profile, day_type: "🏖️ 假期", custom_daily_target: 0 } }));
                        showToast("已使用休息卷！今日目標歸零", "umbrella-beach");
                    } else {
                        showToast("道具已使用", "magic");
                    }
                    const newInv = { ...data.inventory };
                    newInv[itemId]--;
                    if(newInv[itemId] <= 0) delete newInv[itemId];
                    setData(p => ({ ...p, inventory: newInv }));
                };

                return (
                    <div className="space-y-6">
                        <div className="flex gap-4 border-b border-white/10 pb-4 justify-between">
                            <div className="flex gap-4">
                                <button onClick={() => setActiveSubTab('market')} className={`text-xl font-bold ${activeSubTab==='market' ? 'text-gold border-b-2 border-gold' : 'text-gray-400'}`}>祕法集市</button>
                                <button onClick={() => setActiveSubTab('inventory')} className={`text-xl font-bold ${activeSubTab==='inventory' ? 'text-gold border-b-2 border-gold' : 'text-gray-400'}`}>我的背包</button>
                            </div>
                            <button onClick={() => setEditMode(!editMode)} className="text-gray-500 text-sm">🛠️ 老闆模式</button>
                        </div>

                        {activeSubTab === 'market' && (
                            <div>
                                {editMode && (
                                    <div className="arcane-panel p-4 mb-4 border-dashed border-gold/30">
                                        <div className="flex gap-2">
                                            <input className="magic-input p-2 rounded" placeholder="商品名" value={newItem.name} onChange={e => setNewItem({...newItem, name: e.target.value})} />
                                            <input className="magic-input p-2 rounded w-24" type="number" placeholder="價格" value={newItem.cost} onChange={e => setNewItem({...newItem, cost: Number(e.target.value)})} />
                                            <button onClick={addItem} className="btn-primary px-4 rounded">上架</button>
                                        </div>
                                    </div>
                                )}
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    {data.shop.map(item => (
                                        <div key={item.id} className="arcane-panel relative group h-56 flex flex-col justify-between p-5">
                                            <div className="relative z-10">
                                                {editMode ? (
                                                    <>
                                                        <input className="bg-transparent border-b border-white/20 w-full mb-1 text-white font-bold" value={item.name} onChange={e => updateShopItem(item.id, 'name', e.target.value)} />
                                                        <textarea className="bg-transparent border border-white/10 w-full text-xs text-gray-400 h-16 resize-none" value={item.desc} onChange={e => updateShopItem(item.id, 'desc', e.target.value)} />
                                                    </>
                                                ) : (
                                                    <>
                                                        <div className="font-bold text-white text-lg mb-1">{item.name}</div>
                                                        <div className="text-sm text-gray-400 h-12 overflow-hidden">{item.desc}</div>
                                                    </>
                                                )}
                                            </div>
                                            
                                            <div className="flex justify-between items-end relative z-20 pt-2 border-t border-white/5">
                                                <div className={`font-bold text-lg ${CURRENCIES[item.currency].color} flex items-center gap-1`}>
                                                    {editMode ? <input type="number" className="w-16 bg-black text-white" value={item.cost} onChange={e=>updateShopItem(item.id, 'cost', Number(e.target.value))} /> : item.cost} 
                                                    <i className={`fa-solid ${CURRENCIES[item.currency].icon}`}></i>
                                                </div>
                                                
                                                {editMode ? (
                                                    <button onClick={() => setData(p => ({...p, shop: p.shop.filter(i => i.id !== item.id)}))} className="text-red-400 hover:text-red-200 z-50 cursor-pointer relative"><i className="fa-solid fa-trash"></i></button>
                                                ) : (
                                                    <button 
                                                        onClick={(e) => { 
                                                            e.stopPropagation(); 
                                                            e.preventDefault(); 
                                                            buy(item); 
                                                        }} 
                                                        className="relative z-50 bg-gradient-to-r from-gold/20 to-gold/40 hover:from-gold hover:to-yellow-300 hover:text-black border border-gold/50 text-gold px-6 py-2 rounded-full font-bold shadow-lg transition-all active:scale-95 cursor-pointer pointer-events-auto"
                                                    >
                                                        購買
                                                    </button>
                                                )}
                                            </div>
                                            <div className="absolute top-2 right-2 text-xs text-gray-500 z-10">已持有: {data.inventory[item.id] || 0}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeSubTab === 'inventory' && (
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                {Object.keys(data.inventory).length > 0 ? Object.entries(data.inventory).map(([id, count]) => {
                                    const item = data.shop.find(i => i.id == id) || { name: "未知物品", desc: "" };
                                    return (
                                        <div key={id} className="arcane-panel p-4 flex justify-between items-center">
                                            <div>
                                                <div className="font-bold text-white">{item.name}</div>
                                                <div className="text-xs text-gray-400">持有: {count}</div>
                                            </div>
                                            <button onClick={() => useItem(id)} className="px-3 py-1 bg-purple-600 hover:bg-purple-500 rounded text-sm text-white">使用</button>
                                        </div>
                                    );
                                }) : <div className="text-gray-500 col-span-3 text-center py-10">背包空空如也</div>}
                            </div>
                        )}
                    </div>
                );
            };

            // --- 🪙 Tab 6: 交易紀年 (History) ---
            const HistoryView = () => (
                <div className="arcane-panel p-6 h-[600px] overflow-y-auto">
                    <h3 className="text-xl font-title text-fantasy mb-4">交易紀年 (購買紀錄)</h3>
                    <div className="space-y-2">
                        {data.history.map((h, i) => (
                            <div key={i} className="flex justify-between p-3 bg-black/30 rounded border border-white/5">
                                <div><div className="text-gray-200">{h.item}</div><div className="text-xs text-gray-500">{h.date}</div></div>
                                <div className="font-mono font-bold text-red-400">{h.cost}</div>
                            </div>
                        ))}
                        {data.history.length === 0 && <div className="text-gray-500 text-center">無交易紀錄</div>}
                    </div>
                </div>
            );

            // --- 🌌 Tab 7: 星穹殿堂 (Hall) ---
            const HallView = () => {
                const [newAchv, setNewAchv] = useState({ name: "", desc: "", reward: 10, currency: "seed" });
                const toggleAchv = (id) => {
                    const updated = data.achievements.map(a => {
                        if(a.id === id) {
                            if(!a.completed) {
                                setData(prev => ({
                                    ...prev,
                                    profile: { ...prev.profile, [`coins_${a.currency}`]: prev.profile[`coins_${a.currency}`] + a.reward },
                                    adventure_log: [{ date: getLogicalDate(), displayDate: new Date().toLocaleString(), item: `成就: ${a.name}`, cost: `+${a.reward}啟`, type: 'income', details: '成就解鎖' }, ...prev.adventure_log]
                                }));
                                soundEngine.playFanfare();
                                showToast("榮耀解鎖！", "trophy");
                            }
                            return { ...a, completed: !a.completed };
                        }
                        return a;
                    });
                    setData(prev => ({ ...prev, achievements: updated }));
                };
                const addAchv = () => {
                    if(!newAchv.name) return;
                    setData(p => ({...p, achievements: [...p.achievements, { id: Date.now(), ...newAchv, completed: false }]}));
                    setNewAchv({ name: "", desc: "", reward: 10, currency: "seed" });
                };

                return (
                    <div className="space-y-6">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-center">
                            <div className="arcane-panel p-4 border-t-2 border-blue-500"><h4 className="text-blue-300 text-xs mb-1 font-bold">秘銀儲量</h4><div className="text-3xl font-bold font-mono">{Math.floor(data.profile.coins_mithril)}</div></div>
                            <div className="arcane-panel p-4 border-t-2 border-purple-500"><h4 className="text-purple-300 text-xs mb-1 font-bold">完成任務</h4><div className="text-3xl font-bold font-mono">{data.adventure_log.length}</div></div>
                            <div className="arcane-panel p-4 border-t-2 border-gold"><h4 className="text-gold text-xs mb-1 font-bold">目前境界</h4><div className="text-xl font-bold font-title">{titleData.current}</div></div>
                        </div>
                        <div className="arcane-panel p-6">
                            <h3 className="text-xl font-title text-gold mb-4"><i className="fa-solid fa-trophy"></i> 榮耀刻印 (成就管理)</h3>
                            <div className="flex flex-wrap gap-2 mb-6 bg-black/30 p-3 rounded-xl border border-white/5">
                                <input className="magic-input p-2 rounded flex-1" placeholder="成就名稱" value={newAchv.name} onChange={e => setNewAchv({...newAchv, name: e.target.value})} />
                                <input className="magic-input p-2 rounded flex-[2]" placeholder="描述" value={newAchv.desc} onChange={e => setNewAchv({...newAchv, desc: e.target.value})} />
                                <input className="magic-input p-2 rounded w-20 text-center" type="number" value={newAchv.reward} onChange={e => setNewAchv({...newAchv, reward: Number(e.target.value)})} />
                                <button onClick={addAchv} className="bg-green-700 px-4 rounded text-white">新增</button>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 max-h-[400px] overflow-y-auto">
                                {data.achievements.map(achv => (
                                    <div key={achv.id} className={`p-4 rounded-xl border flex justify-between items-center transition-all ${achv.completed ? 'bg-green-900/20 border-green-500/50' : 'bg-black/30 border-white/10'}`}>
                                        <div><div className={`font-bold ${achv.completed ? 'text-green-400' : 'text-gray-300'}`}>{achv.name}</div><div className="text-sm text-gray-500">{achv.desc}</div><div className="text-xs text-gold mt-1">獎勵: {achv.reward}</div></div>
                                        <button onClick={() => toggleAchv(achv.id)} className={`text-2xl ${achv.completed ? 'text-green-400' : 'text-gray-600'}`}><i className={`fa-regular ${achv.completed ? 'fa-square-check' : 'fa-square'}`}></i></button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            };

            // --- ⚙️ Tab 8: 系統設定 (System & Rules) ---
            const SystemView = () => {
                const [editRules, setEditRules] = useState(false);
                const [tempRules, setTempRules] = useState(data.rules);
                const [sysDataBox, setSysDataBox] = useState(""); // 用於備份與還原的文字狀態

                // 組件載入時，自動抓取當前備份資料到輸入框
                useEffect(() => {
                    try {
                        const storageObj = {};
                        for (let i = 0; i < localStorage.length; i++) {
                            const key = localStorage.key(i);
                            storageObj[key] = localStorage.getItem(key);
                        }
                        setSysDataBox(JSON.stringify(storageObj));
                    } catch(e) { console.error("讀取資料失敗", e); }
                }, []);

                const saveRules = () => {
                    setData(p => ({...p, rules: tempRules}));
                    setEditRules(false);
                    showToast("法則已重寫", "scroll");
                };

                const handleMusicUpload = (e) => {
                    const file = e.target.files[0];
                    if(file){
                        const url = URL.createObjectURL(file);
                        setTempRules({...tempRules, music_url: url});
                        if(audioRef.current) {
                            audioRef.current.src = url;
                            audioRef.current.play();
                            showToast("音樂載入", "music");
                        }
                    }
                }

                // 處理資料匯出
                const handleExport = () => {
                    try {
                        const storageObj = {};
                        for (let i = 0; i < localStorage.length; i++) {
                            const key = localStorage.key(i);
                            storageObj[key] = localStorage.getItem(key);
                        }
                        const dump = JSON.stringify(storageObj);
                        setSysDataBox(dump);
                        navigator.clipboard.writeText(dump);
                        showToast("系統資料已複製到剪貼簿", "download");
                    } catch (err) {
                        showToast("匯出失敗，請手動複製", "times");
                    }
                };

                // 處理資料匯入 (防呆)
                const handleImport = () => {
                    const inputData = sysDataBox.trim();
                    if (!inputData) return showToast("請先貼上備份資料", "exclamation");

                    try {
                        const parsedData = JSON.parse(inputData);
                        if (typeof parsedData !== 'object' || parsedData === null) {
                            throw new Error('資料格式不正確');
                        }
                        if (!confirm('系統即將匯入資料。這將會覆蓋您當前的所有進度，確定要繼續嗎？')) return;

                        localStorage.clear();
                        Object.keys(parsedData).forEach(key => {
                            localStorage.setItem(key, parsedData[key]);
                        });
                        alert('✅ 資料已成功匯入！系統將立即重新載入以套用您的進度。');
                        window.location.reload(); 
                    } catch (err) {
                        showToast("匯入失敗！請確認資料格式", "times");
                    }
                };

                return (
                    <div className="space-y-6">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            
                            {/* 系統核心控制 (左欄) */}
                            <div className="arcane-panel p-8 text-center flex flex-col h-full">
                                <h3 className="text-xl font-title text-fantasy mb-6">系統核心</h3>
                                
                                {/* 音樂檔案上傳 */}
                                <div className="bg-black/40 p-4 rounded-xl mb-6 text-left border border-gold/30 shadow-lg">
                                    <h4 className="text-gold text-sm font-bold mb-3 flex items-center gap-2"><i className="fa-solid fa-music"></i> 背景音樂設定</h4>
                                    <div className="flex gap-2 mb-2">
                                        <label className="bg-gradient-to-r from-purple-800 to-indigo-800 hover:from-purple-700 hover:to-indigo-700 text-white px-6 py-3 rounded text-sm cursor-pointer flex-1 text-center transition font-bold shadow-md border border-purple-500/50">
                                            <i className="fa-solid fa-file-audio mr-2"></i> 點擊上傳音樂檔案 (MP3)
                                            <input type="file" accept="audio/*" className="hidden" onChange={handleMusicUpload} />
                                        </label>
                                    </div>
                                    {tempRules.music_url && tempRules.music_url.startsWith('blob:') && <p className="text-xs text-green-400 mb-2"><i className="fa-solid fa-check"></i> 已載入本地檔案</p>}
                                    <div className="mt-4 flex items-center gap-2">
                                        <label className="text-xs text-gray-400">音量</label>
                                        <input type="range" min="0" max="1" step="0.1" value={tempRules.music_volume || 0.3} onChange={e => {
                                            setTempRules({...tempRules, music_volume: parseFloat(e.target.value)});
                                            if(audioRef.current) audioRef.current.volume = parseFloat(e.target.value);
                                        }} className="flex-1 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer" />
                                    </div>
                                </div>
                                
                                {/* Reset Day Time */}
                                <div className="bg-black/40 p-4 rounded-xl mb-6 text-left border border-gold/30">
                                    <h4 className="text-gold text-sm font-bold mb-3">一日結算時間</h4>
                                    <div className="flex items-center gap-2 text-sm text-gray-300">
                                        <span>新的一天開始於:</span>
                                        <input type="number" min="0" max="23" className="magic-input w-16 p-1 text-center rounded" value={tempRules.reset_hour || 0} onChange={e => setTempRules({...tempRules, reset_hour: Number(e.target.value)})} />
                                        <span>:00</span>
                                    </div>
                                    <p className="text-xs text-gray-500 mt-1">例如設定為 3，則凌晨 2:59 仍算作「昨天」。</p>
                                </div>

                                <div className="mt-auto">
                                    <button onClick={() => { soundEngine.playSFX('error'); confirm("確定重置？所有進度將會消失！") && setData(INITIAL_DATA); }} className="w-full py-2 bg-red-900/30 hover:bg-red-900/60 rounded border border-red-500/30 text-red-400 text-sm transition">⚠️ 重置所有數據</button>
                                </div>
                            </div>

                            {/* 資料管理區塊 (右欄 - 原漂浮面板升級版) */}
                            <div className="arcane-panel p-8 text-center flex flex-col h-full border-t-4 border-t-purple-500 shadow-[0_0_30px_rgba(139,92,246,0.3)]">
                                <h3 className="text-xl font-title text-fantasy mb-2 text-purple-300 flex items-center justify-center gap-2">
                                    <i className="fa-solid fa-database text-purple-400"></i> 系統資料管理 (備份/還原)
                                </h3>
                                <p className="text-xs text-gray-400 mb-6">定期匯出您的進度以防資料遺失，或將舊資料貼上以覆蓋當前紀錄。</p>

                                <textarea 
                                    className="magic-input w-full flex-1 p-3 rounded text-xs text-gray-300 mb-4 font-mono custom-scrollbar resize-none border border-white/20 hover:border-purple-500/50 transition-all min-h-[150px]" 
                                    placeholder="請在此貼上備份資料（JSON格式）以進行匯入..." 
                                    value={sysDataBox} 
                                    onChange={e => setSysDataBox(e.target.value)}
                                ></textarea>
                                
                                <div className="flex gap-4">
                                    <button onClick={handleExport} className="flex-1 py-3 bg-blue-600 hover:bg-blue-500 rounded-lg font-bold transition shadow-[0_4px_15px_rgba(37,99,235,0.4)] hover:-translate-y-1">
                                        <i className="fa-solid fa-download mr-1"></i> 匯出並複製
                                    </button>
                                    <button onClick={handleImport} className="flex-1 py-3 bg-green-600 hover:bg-green-500 rounded-lg font-bold transition shadow-[0_4px_15px_rgba(22,163,74,0.4)] hover:-translate-y-1">
                                        <i className="fa-solid fa-upload mr-1"></i> 匯入舊資料
                                    </button>
                                </div>
                            </div>

                        </div>

                        {/* 💰 經濟法則編輯器 (下方滿版) */}
                        <div className="arcane-panel p-6">
                            <div className="flex justify-between items-center mb-4 border-b border-white/10 pb-2">
                                <h3 className="text-xl font-title text-gold"><i className="fa-solid fa-scale-balanced"></i> 經濟法則 (貨幣獲取規則)</h3>
                                <button onClick={() => editRules ? saveRules() : setEditRules(true)} className="bg-slate-700 px-3 py-1 rounded text-sm">{editRules?'保存':'編輯'}</button>
                            </div>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                <div className="col-span-2 md:col-span-4 text-gold text-xs font-bold border-b border-white/10 pt-2">基礎產量</div>
                                <div><label className="text-xs text-gray-400">秘銀產量 (每分鐘)</label><input type="number" className="magic-input w-full p-2 rounded" disabled={!editRules} value={tempRules.money_per_min} onChange={e=>setTempRules({...tempRules, money_per_min: Number(e.target.value)})}/></div>
                                <div><label className="text-xs text-gray-400">討厭任務加成 (倍率)</label><input type="number" className="magic-input w-full p-2 rounded" disabled={!editRules} value={tempRules.hate_mult} onChange={e=>setTempRules({...tempRules, hate_mult: Number(e.target.value)})}/></div>
                                
                                <div className="col-span-2 md:col-span-4 text-gold text-xs font-bold border-b border-white/10 pt-2 mt-2">難度係數</div>
                                <div><label className="text-xs text-green-400">簡單係數</label><input type="number" className="magic-input w-full p-2 rounded" disabled={!editRules} value={tempRules.diff_easy} onChange={e=>setTempRules({...tempRules, diff_easy: Number(e.target.value)})}/></div>
                                <div><label className="text-xs text-yellow-400">中等係數</label><input type="number" className="magic-input w-full p-2 rounded" disabled={!editRules} value={tempRules.diff_med} onChange={e=>setTempRules({...tempRules, diff_med: Number(e.target.value)})}/></div>
                                <div><label className="text-xs text-orange-400">困難係數</label><input type="number" className="magic-input w-full p-2 rounded" disabled={!editRules} value={tempRules.diff_hard} onChange={e=>setTempRules({...tempRules, diff_hard: Number(e.target.value)})}/></div>
                                <div><label className="text-xs text-red-400">極難係數</label><input type="number" className="magic-input w-full p-2 rounded" disabled={!editRules} value={tempRules.diff_ext} onChange={e=>setTempRules({...tempRules, diff_ext: Number(e.target.value)})}/></div>
                                
                                <div className="col-span-2 md:col-span-4 text-gold text-xs font-bold border-b border-white/10 pt-2 mt-2">特殊貨幣</div>
                                <div><label className="text-xs text-yellow-500">星耀門檻 (分鐘)</label><input type="number" className="magic-input w-full p-2 rounded" disabled={!editRules} value={tempRules.star_threshold} onChange={e=>setTempRules({...tempRules, star_threshold: Number(e.target.value)})}/></div>
                                <div><label className="text-xs text-cyan-400">漣漪獎勵 (打卡)</label><input type="number" className="magic-input w-full p-2 rounded" disabled={!editRules} value={tempRules.checkin_reward} onChange={e=>setTempRules({...tempRules, checkin_reward: Number(e.target.value)})}/></div>
                            </div>
                        </div>
                    </div>
                );
            };

          
            // --- Modal (日曆詳情 & 可編輯版) ---
            const CalendarModal = ({ info, onClose }) => {
                const isToday = info.dateStr === getLogicalDate();
                const [editMode, setEditMode] = useState(false);
                
                // 本地狀態：記錄編輯中的數據
                const [editData, setEditData] = useState({
                    achieved: info.dailyRecord?.achieved || 0,
                    target: info.dailyRecord?.target || data.rules.daily_target_def,
                    note: info.dailyRecord?.note || ""
                });

                const saveEdit = () => {
                    setData(prev => {
                        const newData = { ...prev };
                        
                        // 更新目標日的日誌紀錄
                        newData.daily_records = {
                            ...newData.daily_records,
                            [info.dateStr]: editData
                        };

                        // 如果編輯的是「今天」，同時更新右側即時面板的數據
                        if (isToday) {
                            newData.profile = {
                                ...newData.profile,
                                today_coins: editData.achieved,
                                custom_daily_target: editData.target,
                                custom_daily_note: editData.note
                            };
                        }
                        return newData;
                    });
                    showToast("時光織錦已更新", "check");
                    setEditMode(false);
                };

                return (
                    <div className="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-4 animate-float" onClick={onClose}>
                        <div className="arcane-panel max-w-md w-full p-6 relative border-gold/30 shadow-[0_0_50px_rgba(139,92,246,0.3)]" onClick={e => e.stopPropagation()}>
                            <button onClick={onClose} className="absolute top-4 right-4 text-gray-500 hover:text-white transition"><i className="fa-solid fa-times fa-lg"></i></button>
                            <h3 className="text-2xl font-title text-fantasy mb-4 border-b border-white/10 pb-2">{info.dateStr}</h3>
                            
                            <div className="space-y-4">
                                {/* 編輯區塊 */}
                                <div className="bg-black/40 p-4 rounded text-center relative border border-white/5 transition hover:border-white/10">
                                    <button 
                                        onClick={() => setEditMode(!editMode)} 
                                        className={`absolute top-2 right-2 text-sm transition ${editMode ? 'text-green-400' : 'text-gray-500 hover:text-white'}`}
                                        title="編輯當日紀錄"
                                    >
                                        <i className="fa-solid fa-pen"></i>
                                    </button>
                                    
                                    <div className="text-sm text-gray-400 mb-2">當日總收益 / 目標</div>
                                    
                                    {editMode ? (
                                        <div className="flex justify-center items-center gap-2 mb-3">
                                            <input type="number" className="magic-input w-24 text-center rounded text-gold font-bold p-1" value={editData.achieved} onChange={e=>setEditData({...editData, achieved: Number(e.target.value)})} />
                                            <span className="text-white">/</span>
                                            <input type="number" className="magic-input w-24 text-center rounded text-gray-300 p-1" value={editData.target} onChange={e=>setEditData({...editData, target: Number(e.target.value)})} />
                                        </div>
                                    ) : (
                                        <div className="text-3xl text-gold font-bold mb-3">{editData.achieved} <span className="text-sm text-gray-400">/ {editData.target} 秘銀</span></div>
                                    )}

                                    <div className="mt-2 pt-2 border-t border-white/10 text-left">
                                        <div className="text-xs text-gray-500 mb-1">備註 (心得/回顧)</div>
                                        {editMode ? (
                                            <textarea className="magic-input w-full p-2 text-sm rounded resize-none custom-scrollbar" rows="2" placeholder="記下今天的點滴..." value={editData.note} onChange={e=>setEditData({...editData, note: e.target.value})}></textarea>
                                        ) : (
                                            <div className="text-sm text-gray-300 italic min-h-[40px]">{editData.note || "（當日無備註）"}</div>
                                        )}
                                    </div>

                                    {editMode && (
                                        <button onClick={saveEdit} className="w-full mt-4 py-2 bg-green-600 hover:bg-green-500 rounded text-sm font-bold text-white shadow-lg transition active:scale-95">
                                            儲存變更
                                        </button>
                                    )}
                                </div>

                                {/* 冒險紀錄顯示區 (唯讀) */}
                                <div className="max-h-52 overflow-y-auto custom-scrollbar pr-1">
                                    <div className="text-white font-bold mb-2 text-sm border-b border-white/5 pb-1">📜 系統生成的冒險紀錄</div>
                                    {info.logs.length ? info.logs.map((l,i) => (
                                        <div key={i} className="text-xs text-gray-300 bg-white/5 p-2 mb-1 rounded border border-white/5 flex justify-between">
                                            <span>{l.item}</span>
                                            <span className="text-gold">{l.cost}</span>
                                        </div>
                                    )) : <div className="text-gray-500 text-xs italic text-center py-2">無自動生成紀錄</div>}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            // --- 首次進入歡迎頁 ---
            if (!data.setupComplete && started) {
                return (
                    <div className="fixed inset-0 z-50 bg-black flex items-center justify-center p-4">
                        <div className="arcane-panel max-w-lg w-full p-8 text-center animate-fade-in border-2 border-gold">
                            <h1 className="text-4xl font-fantasy text-gold-glow mb-4">靈魂綁定儀式</h1>
                            <p className="text-gray-300 mb-6 leading-relaxed">歡迎來到星域主宰系統。你是被選中的旅人。<br/>請告知你的真名，以便銘刻於時光織錦之上。</p>
                            <input className="magic-input w-full p-3 rounded text-center text-xl mb-6 border-gold/50" placeholder="輸入你的名字..." onKeyDown={(e) => { if(e.key === 'Enter' && e.target.value) { setData(p => ({ ...p, userName: e.target.value, setupComplete: true })); soundEngine.playSFX('success'); } }} />
                            <p className="text-xs text-gray-500">按 Enter 完成儀式</p>
                        </div>
                    </div>
                );
            }

            // --- 啟動頁面 ---
            if (!started) {
                return (
                    <div className="h-screen flex flex-col items-center justify-center relative z-20">
                        <div className="text-6xl md:text-8xl font-fantasy text-gold-glow mb-8 animate-pulse text-center tracking-widest drop-shadow-[0_0_30px_rgba(255,215,0,0.5)]">
                            星域主宰<br/><span className="text-2xl font-sans text-accent tracking-[1em] block mt-4">ASTRAL MASTER</span>
                        </div>
                        <button onClick={startSystem} className="px-12 py-5 bg-transparent border-2 border-gold text-gold font-bold text-xl rounded-full hover:bg-gold hover:text-black transition duration-500 shadow-[0_0_50px_rgba(255,215,0,0.4)] animate-float"><i className="fa-solid fa-play"></i> 啟動魔法陣</button>
                    </div>
                );
            }

            // --- 主要內容 ---
            return (
                <div className="min-h-screen p-4 lg:p-8 flex flex-col lg:flex-row gap-8 max-w-[1600px] mx-auto relative z-10 animate-fade-in">
                    <audio ref={audioRef} loop src={data.rules.music_url || "https://cdn.pixabay.com/audio/2022/05/27/audio_1808fbf07a.mp3"} />
                    
                    {toast && <div className="fixed top-6 left-1/2 transform -translate-x-1/2 z-50 arcane-panel px-6 py-3 rounded-full flex items-center gap-3 border border-gold text-gold animate-bounce shadow-[0_0_30px_rgba(255,215,0,0.4)]"><i className={`fa-solid fa-${toast.icon} text-xl`}></i> <span className="font-bold">{toast.msg}</span></div>}
                    {modal && modal.type === 'day_detail' && <CalendarModal info={modal.data} onClose={() => setModal(null)} />}
                    {modal && modal.type === 'daily_welcome' && (
                        <div className="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4">
                            <div className="arcane-panel p-8 text-center border-gold/50 border">
                                <h3 className="text-3xl text-gold mb-4">歡迎回來，{data.userName}</h3>
                                <p className="text-xl text-white italic mb-6">"{modal.quote}"</p>
                                <button onClick={() => setModal(null)} className="btn-primary px-8 py-2 rounded-full">開始冒險</button>
                            </div>
                        </div>
                    )}
                    {modal && modal.type === 'end_day_summary' && (
                        <div className="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4">
                            <div className="arcane-panel p-8 text-center border-gold border shadow-[0_0_50px_rgba(255,215,0,0.5)]">
                                <h3 className="text-4xl font-fantasy text-gold mb-4">旅途結算</h3>
                                <div className="text-6xl mb-6">🎉</div>
                                <div className="text-2xl text-white mb-2">今日獲得 <span className="text-gold font-bold">{Math.floor(data.profile.today_coins)}</span> 秘銀</div>
                                <p className="text-gray-400 mb-4">{data.profile.custom_daily_note || "今日無備註"}</p>
                                <button onClick={() => setModal(null)} className="btn-primary px-8 py-2 rounded-full mt-6">明日再戰</button>
                            </div>
                        </div>
                    )}

                    <Sidebar 
                        data={data} 
                        setData={setData} 
                        titleData={titleData} 
                        showToast={showToast} 
                        setModal={setModal} 
                        audioRef={audioRef}
                        soundEngine={soundEngine}
                    />

                    <div className="flex-1 flex flex-col gap-6 min-w-0">
                        {/* 導航 */}
                        <div className="arcane-panel p-2 flex overflow-x-auto gap-2 scrollbar-hide border-b-2 border-accent/30">
                            {[
                                { id: "calendar", icon: "calendar-days", label: "時光織錦" },
                                { id: "goals", icon: "compass", label: "命途星圖" },
                                { id: "tasks", icon: "scroll", label: "征途繪卷" },
                                { id: "adventure_log", icon: "book-journal-whills", label: "冒險手札" },
                                { id: "shop", icon: "store", label: "祕法集市" },
                                { id: "history", icon: "clock-rotate-left", label: "交易紀年" },
                                { id: "hall", icon: "dungeon", label: "星穹殿堂" },
                                { id: "system", icon: "gears", label: "系統" },
                            ].map(tab => (
                                <button key={tab.id} onClick={() => { setActiveTab(tab.id); soundEngine.playSFX('click'); }} className={`px-5 py-3 rounded-lg font-bold whitespace-nowrap transition flex items-center gap-2 ${activeTab === tab.id ? 'bg-gradient-to-r from-indigo-900 to-purple-900 text-white border border-accent shadow-[0_0_20px_rgba(139,92,246,0.4)]' : 'text-gray-400 hover:text-white hover:bg-white/5'}`}>
                                    <i className={`fa-solid fa-${tab.icon}`}></i> {tab.label}
                                </button>
                            ))}
                        </div>

                        <div className="min-h-[500px]">
                            {activeTab === "calendar" && <CalendarView />}
                            {activeTab === "goals" && <GoalView />}
                            {activeTab === "tasks" && <TaskView />}
                            {activeTab === "adventure_log" && <AdventureLogView />}
                            {activeTab === "shop" && <ShopView />}
                            {activeTab === "history" && <HistoryView />}
                            {activeTab === "hall" && <HallView />}
                            {activeTab === "system" && <SystemView />}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
